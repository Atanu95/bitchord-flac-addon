name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-policy-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile server.py
      - name: Check version, provider and quality policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import server

          manifest_file = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          assert manifest_file["version"] == "1.15.0"
          assert server.MANIFEST["version"] == "1.15.0"
          from urllib.parse import parse_qs, urlparse

          assert server.build_genre_query("Arijit Singh", "bollywood") == "Bollywood Arijit Singh"
          response = server.app.test_client().get(
              "/amazon-music-search?q=Arijit%20Singh&genre=bollywood"
          )
          assert response.status_code == 302
          amazon_location = urlparse(response.headers["Location"])
          assert amazon_location.netloc == "music.amazon.in"
          assert parse_qs(amazon_location.query)["q"] == ["Bollywood Arijit Singh"]
          assert server.build_genre_query("Bollywood hits", "bollywood") == "Bollywood hits"
          assert server.build_genre_query("Arijit Singh", "all") == "Arijit Singh"
          assert server.build_search_variants("Arijit Singh", "bollywood") == [
              "Bollywood Arijit Singh", "Arijit Singh"
          ]
          assert server.build_search_variants("Bollywood hits", "bollywood") == [
              "Bollywood hits"
          ]
          assert server.build_search_variants("Arijit Singh", "all") == [
              "Arijit Singh"
          ]
          assert server.build_genre_query("Pitbull", "english") == "English Pitbull"
          assert server.build_search_variants("Pitbull", "english") == [
              "Pitbull", "English Pitbull"
          ]
          assert server.normalize_artist_query("Weekand") == "The Weeknd"
          assert server.normalize_artist_query("The Weeknd") == "The Weeknd"
          assert "english" in [item["value"] for item in server.MANIFEST["settings"][-1]["options"]]
          assert server.relevance_score(
              "Arijit Singh",
              {"title": "Tum Hi Ho", "creator": "Arijit Singh"}
          ) > 0
          assert server.relevance_score(
              "Arijit Singh",
              {"title": "Electronic Dreams", "creator": "Unknown Artist"}
          ) == 0
          assert server.jamendo_license_is_allowed({
              "license_ccurl": "https://creativecommons.org/licenses/by/4.0/"
          })
          assert not server.jamendo_license_is_allowed({"license_ccurl": ""})
          assert server.is_hires(96000, 24)
          assert server.is_hires(192000, 24)
          assert not server.is_hires(48000, 24)
          assert not server.is_hires(96000, 16)
          print("Layz Add On policy checks passed.")
          PY
